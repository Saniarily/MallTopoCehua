# Conda environment for MallTopoCehua (tested target: macOS Apple Silicon, Python 3.11)
# Create:  conda env create -f environment.yml
# Or reuse the existing `mallranker` env:  conda activate mallranker && pip install -e ".[dev]"
name: malltopocehua
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - scipy>=1.10
  - networkx>=3.1
  - shapely>=2.0
  - pyyaml>=6.0
  - tqdm>=4.66
  - matplotlib>=3.7
  - pytest>=7.4
  - pip:
      - pydantic>=2.5
      - joblib>=1.3
      - -e ".[dev]"
