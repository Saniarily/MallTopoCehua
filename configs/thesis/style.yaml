# 论文图表样式（所有图共用；改这里即可全局换字体 / 配色 / 尺寸 / 中文标签）
# 生成：python scripts/make_thesis_report.py --results data/results_snapshot --out outputs/thesis
fonts:
  # 按顺序探测，取第一个本机存在的字体；Mac 上通常是 PingFang SC / Hiragino Sans GB
  cjk_candidates: ["PingFang SC", "Hiragino Sans GB", "Songti SC", "STHeiti", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "SimHei", "WenQuanYi Micro Hei"]
  latin_candidates: ["Helvetica Neue", "Helvetica", "Arial", "DejaVu Sans"]
  size_base: 10.5      # 正文字号（pt）
  size_title: 12
  size_label: 10.5
  size_tick: 9.5
  size_legend: 9.5
  size_annot: 8.5

figure:
  dpi: 300
  formats: ["png", "pdf", "svg"]   # svg/pdf 可在 Illustrator / Inkscape 中直接编辑
  width_single: 3.5     # 英寸：单栏
  width_double: 7.2     # 英寸：双栏
  height_ratio: 0.62
  transparent: false
  grid_alpha: 0.25
  spine_width: 0.8
  bar_edge: "white"
  errorbar_capsize: 3
  savefig_pad: 0.05

palette:
  # 类别色（Okabe–Ito 无障碍配色为基础，略调深）
  main: ["#0072B2", "#E69F00", "#009E73", "#D55E00", "#CC79A7", "#56B4E9", "#F0E442", "#999999"]
  reference: "#7F7F7F"       # 上/下界、参照线
  highlight: "#C0392B"       # 本文方法强调色
  ours: "#0072B2"
  baseline: "#A6A6A6"
  ground_truth: "#2C3E50"
  ci_fill_alpha: 0.18
  method_colors:             # 指定方法的固定颜色（可选；未列出的按 main 轮换）
    quality_oracle: "#7F7F7F"
    random: "#BDBDBD"
    weighted_rule: "#9E9E9E"
    extra_trees: "#0072B2"
    deep_residual: "#C0392B"
    ridge: "#56B4E9"
    lgbm_regressor: "#009E73"
    lgbm_lambdarank: "#E69F00"
    random_forest: "#CC79A7"
    mlp: "#D55E00"
    ref_ground_truth: "#2C3E50"
    stage2_rule_baseline: "#A6A6A6"
    stage2_search_baseline: "#7F7F7F"
    stage2_ar_gnn: "#0072B2"
    stage2_ar_gnn_greedy: "#56B4E9"
    stage2_ar_gnn_bestof16: "#C0392B"
    stage2_ar_gnn_long: "#009E73"
    stage2_ar_gnn_long_bestof16: "#E69F00"
    stage2_ar_gnn_bfs_order: "#CC79A7"
    stage2_ar_gnn_single_label: "#D55E00"
    stage2_ar_gnn_basic_feats: "#F0E442"

# 中文显示名（图例、坐标轴、表格）。键 = 代码中的名字。改这里即可改图中文字。
