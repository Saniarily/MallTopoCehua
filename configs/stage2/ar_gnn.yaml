_base_: rule_baseline.yaml
experiment_name: stage2_ar_gnn
corpus: data/samples/synthetic/sharegpt_sample.json     # real: set via ar_gnn.local.yaml → /path/to/sharegpt_data.json
eval_holdout: 600                                         # last 600 samples are never trained on; evaluate_stage2 uses them
checkpoint_dir: outputs/checkpoints/stage2
stage2:
  generator:
    name: ar_gnn
    params: {d_model: 64, n_layers: 3, dropout: 0.1, lr: 0.001, weight_decay: 0.0001, epochs: 12, patience: 4,
             label_smoothing: 0.05, ensemble_k: 3, temperature: 0.7, best_of: 1, seed: 42,
             checkpoint: outputs/checkpoints/stage2/stage2_ar_gnn}
