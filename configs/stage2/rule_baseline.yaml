seed: 0
experiment_name: stage2_rule_baseline
stage2:
  generator: {name: rule_expander, params: {label_style: letters}}
  geometry_decoder: {name: planar_corridor, params: {margin_frac: 0.16, max_frontage_dist: 4.0, ortho_weight: 0.6, max_atria: 3, atrium_area_max: 900.0}}   # v1: corridor_partition
  repairer: {name: basic, params: {drop_unreachable: true, merge_small: true}}
  evaluator:
    name: topology_spec
    params:
      thresholds: {node_deviation_pct_max: 30, edge_accuracy_pct_min: 70, density_deviation_pct_max: 40, aspl_deviation_pct_max: 35, inference_time_s_max: 60}
  geometry_evaluator: {name: geometry, params: {min_inside_ratio: 0.98, max_overlap_rate: 0.01, min_reachable_rate: 0.9}}
n_candidates: 3
corpus: data/samples/synthetic/sharegpt_sample.json   # real: data/processed/legacy/stage2_corpus_v2.jsonl (scripts/build_stage2_corpus.py); v1 ShareGPT json still accepted
eval_holdout: 600                                       # only used for v1 (.json) corpora; v2 (.jsonl) carries a mall-grouped split
eval_split: test
output_dir: outputs/generated_layouts
