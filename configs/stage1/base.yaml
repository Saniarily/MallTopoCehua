seed: 42
# Default = real data (run scripts/prepare_data.py --config configs/data/legacy.yaml first).
# For smoke runs: --override data.processed_dir=data/processed/synthetic
data: {processed_dir: data/processed/legacy}
features:
  use_condition: true
  use_prototype_metrics: true
  use_graph_metrics: true
  use_match: true
stage1:
  hard_filter: {area_thresholds: [200000, 450000], min_candidates: 5, allow_relaxation: true}
  retriever: {name: knn, params: {metric: euclidean}}
  recall_top_n: 200
  ranker: {name: extra_trees, params: {n_estimators: 300, pairs_per_query: 20}}   # selected on real data (round 2)
  type_recommender: {enabled: true, n_estimators: 400, min_samples_leaf: 5, n_bootstrap: 20}
  explainer: {name: template}
  counterfactuals: {enabled: true, deltas: {total_area: 0.3, count_1km: 0.5, PCDI_2023: 0.2}}
  candidate_splits: [train]
eval: {split: test, ks: [5, 10, 20], binary_top_frac: 0.2, min_candidates: 5}
output_dir: outputs/experiments/stage1
